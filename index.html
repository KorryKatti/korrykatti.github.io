  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-deep, #fff); }
    .frame-layout { display: flex; height: 100vh; width: 100vw; }
    .frame-left { width: 260px; min-width: 220px; height: 100%; border: 0; border-right: 1px solid var(--border-color, #000); }
    .frame-right { flex: 1; height: 100%; border: 0; min-width: 0; }
  </style>
  <script>
    (function(){
      // prevent the shell from being loaded inside a frame (avoids nested sidebars)
      if (window.self !== window.top) {
        window.top.location = window.location.href;
        return;
      }
      var t = localStorage.getItem('theme');
      if (t === 'dark') document.documentElement.classList.add('dark-mode');
      window.addEventListener('DOMContentLoaded', function(){
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
      });
      window.addEventListener('storage', function(e){ if(e.key==='theme'){ document.body.classList.toggle('dark-mode', e.newValue==='dark'); } });
    })();
  </script>
</head>
<body>
  <div class="frame-layout">
    <iframe src="explorer.html" title="Explorer" class="frame-left" name="explorer-frame"></iframe>
    <iframe src="home.html" title="Main" class="frame-right" name="main-frame"></iframe>
  </div>
</body>
